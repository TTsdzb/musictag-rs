[package]
name = "musictag"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
slint = { version = "1.19.0", features = ["renderer-software"] }
png = "0.18"
lofty = "0.22"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
aes = "0.8"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
    "bmp",
    "gif",
] }
symphonia = { version = "0.5", features = [
    "flac",
    "mp3",
    "aac",
    "alac",
    "isomp4",
    "ogg",
    "pcm",
    "vorbis",
    "wav",
] }
ebur128 = "0.1"
walkdir = "2"
regex = "1"
encoding_rs = "0.8"
zhconv = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "6"
filetime = "0.2"
chrono = { version = "0.4", features = ["clock"] }
rayon = "1"
rfd = "0.15"
rquickjs = "0.9"
anyhow = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
slint-build = "1.19.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
