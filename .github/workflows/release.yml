name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.artifact_name }})
    runs-on: ${{ matrix.os }}
    fail-fast: false
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            os_family: linux
            arch_label: x86_64
            artifact_name: linux-x86_64
            run_tests: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            os_family: windows
            arch_label: x86_64
            artifact_name: windows-x86_64
            run_tests: true
          - os: macos-latest
            target: aarch64-apple-darwin
            os_family: macos
            arch_label: aarch64
            artifact_name: macos-aarch64
            run_tests: true
          - os: macos-latest
            target: x86_64-apple-darwin
            os_family: macos
            arch_label: x86_64
            artifact_name: macos-x86_64
            run_tests: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release version
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          bundle_ver="${version#v}"
          if [[ ! "${bundle_ver}" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            bundle_ver=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "([^"]+)".*/\1/')
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "bundle_version=${bundle_ver}" >> "${GITHUB_OUTPUT}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ matrix.target }}

      - name: Install Linux desktop build dependencies
        if: matrix.os_family == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libgl1-mesa-dev

      - name: Set up MSVC environment
        if: matrix.os_family == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Run unit tests
        if: matrix.run_tests
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build release binary
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package Linux archive (.tar.gz)
        if: matrix.os_family == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          pkg_name="musictag-${{ steps.meta.outputs.version }}-linux-${{ matrix.arch_label }}"
          stage_dir="stage/${pkg_name}"
          mkdir -p "${stage_dir}/plugins/sources" dist
          cp "target/${{ matrix.target }}/release/musictag" "${stage_dir}/musictag"
          chmod +x "${stage_dir}/musictag"
          cp -r plugins/sources/example-template "${stage_dir}/plugins/sources/"
          cp README.md LICENSE "${stage_dir}/"
          tar -C stage -czf "dist/${pkg_name}.tar.gz" "${pkg_name}"

      - name: Package Windows archive (.zip)
        if: matrix.os_family == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pkgName = "musictag-${{ steps.meta.outputs.version }}-windows-${{ matrix.arch_label }}"
          $stageDir = "stage/$pkgName"
          New-Item -ItemType Directory -Force -Path "$stageDir/plugins/sources", "dist" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/musictag.exe" "$stageDir/musictag.exe"
          Copy-Item -Recurse "plugins/sources/example-template" "$stageDir/plugins/sources/example-template"
          Copy-Item "README.md", "LICENSE" "$stageDir/"
          Compress-Archive -Path "$stageDir/*" -DestinationPath "dist/$pkgName.zip" -Force

      - name: Package ad-hoc signed macOS app bundle (.dmg)
        if: matrix.os_family == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          app_name="MusicTag Native"
          bundle_ver="${{ steps.meta.outputs.bundle_version }}"
          version="${{ steps.meta.outputs.version }}"
          arch="${{ matrix.arch_label }}"
          dmg_name="musictag-${version}-macos-${arch}.dmg"

          stage_root="$(mktemp -d)"
          app_dir="${stage_root}/${app_name}.app"
          iconset_dir="$(mktemp -d)/AppIcon.iconset"
          mkdir -p \
            "${app_dir}/Contents/MacOS" \
            "${app_dir}/Contents/Resources/plugins/sources" \
            "${iconset_dir}" \
            dist

          # Build multi-resolution AppIcon.icns from 512px RGBA master PNG
          sips -z 16 16 assets/app-icon-512.png --out "${iconset_dir}/icon_16x16.png" >/dev/null
          sips -z 32 32 assets/app-icon-512.png --out "${iconset_dir}/icon_16x16@2x.png" >/dev/null
          sips -z 32 32 assets/app-icon-512.png --out "${iconset_dir}/icon_32x32.png" >/dev/null
          sips -z 64 64 assets/app-icon-512.png --out "${iconset_dir}/icon_32x32@2x.png" >/dev/null
          sips -z 128 128 assets/app-icon-512.png --out "${iconset_dir}/icon_128x128.png" >/dev/null
          sips -z 256 256 assets/app-icon-512.png --out "${iconset_dir}/icon_128x128@2x.png" >/dev/null
          sips -z 256 256 assets/app-icon-512.png --out "${iconset_dir}/icon_256x256.png" >/dev/null
          cp assets/app-icon-512.png "${iconset_dir}/icon_256x256@2x.png"
          cp assets/app-icon-512.png "${iconset_dir}/icon_512x512.png"
          iconutil -c icns "${iconset_dir}" -o "${app_dir}/Contents/Resources/AppIcon.icns"

          # Populate .app bundle binary, plugins, and Info.plist
          cp "target/${{ matrix.target }}/release/musictag" "${app_dir}/Contents/MacOS/musictag"
          chmod +x "${app_dir}/Contents/MacOS/musictag"
          cp -r plugins/sources/example-template "${app_dir}/Contents/Resources/plugins/sources/"

          cat > "${app_dir}/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>zh_CN</string>
            <key>CFBundleDisplayName</key>
            <string>MusicTag Native</string>
            <key>CFBundleExecutable</key>
            <string>musictag</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>CFBundleIdentifier</key>
            <string>com.ttsdzb.musictag</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>MusicTag Native</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${bundle_ver}</string>
            <key>CFBundleVersion</key>
            <string>${bundle_ver}</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>NSSupportsAutomaticGraphicsSwitching</key>
            <true/>
          </dict>
          </plist>
          EOF

          # Ad-hoc self-sign and strictly verify signature before imaging
          codesign --force --deep --sign - --timestamp=none "${app_dir}"
          codesign --verify --deep --strict --verbose=2 "${app_dir}"

          # Build compressed .dmg with Applications drag-install symlink
          ln -s /Applications "${stage_root}/Applications"
          for attempt in 1 2 3; do
            if hdiutil create -volname "${app_name}" -srcfolder "${stage_root}" -ov -format UDZO "dist/${dmg_name}"; then
              break
            fi
            if [[ "${attempt}" -eq 3 ]]; then
              exit 1
            fi
            sleep 5
          done

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.artifact_name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish Draft Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: "MusicTag Native ${{ github.ref_name }}"
          generate_release_notes: true
          files: dist/*
          body: |
            ## MusicTag Native ${{ github.ref_name }}

            ### 产物说明
            - **Linux (`x86_64`)**: `musictag-${{ github.ref_name }}-linux-x86_64.tar.gz`
            - **Windows (`x86_64`)**: `musictag-${{ github.ref_name }}-windows-x86_64.zip`（内含图标与版本资源）
            - **macOS (`Apple Silicon / aarch64`)**: `musictag-${{ github.ref_name }}-macos-aarch64.dmg`
            - **macOS (`Intel / x86_64`)**: `musictag-${{ github.ref_name }}-macos-x86_64.dmg`

            > **macOS 首次打开提示说明**：本版本中的 `.app` 使用 **ad-hoc 本地自签名（`codesign --sign -`）**，未经过 Apple 公证（Notarization）。如系统提示“已损坏”或“无法验证开发者”，请在拖入「应用程序」目录后于终端执行：
            > ```sh
            > xattr -cr "/Applications/MusicTag Native.app"
            > ```
